<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Sorter</title>
    <link rel="stylesheet" href="./styles.css"/>
</head>
<body>

    <div class="app-shell">
        <header class="hero">
            <h1 class="Name">Sorting Visualizer</h1>
        </header>

        <section class="controls-card">
            <div class="Option">
                <div class="Randomizer control-block">
                    <button class="button" id="GenerateNewRandomArray">New Random Array</button>
                </div>

                <div class="Slider control-block">
                    <label for="myRange">Size</label>
                    <input type="range" min="0" max="100" value="0" class="slider" id="myRange">
                    <p id="sliderValue" class="sliderValue">0</p>
                </div>

                <div class="Slider control-block">
                    <label for="myRange2">Speed</label>
                    <input type="range" min="0" max="100" value="0" class="slider" id="myRange2">
                    <p id="sliderValue2" class="sliderValue">1</p>
                </div>

                <div class="dropdown control-block">
                    <label for="dropDownValue">Sorting Algorithm</label>
                    <select id="dropDownValue" name="referrer">
                        <option value="1">Bubble Sort</option>
                        <option value="2">Selection Sort</option>
                        <option value="3">Insertion Sort</option>
                        <option value="4">Quick Sort</option>
                        <option value="5">Shell Sort</option>
                        <option value="6">Merge Sort</option>
                        <option value="7">Heap Sort</option>
                    </select>
                </div>
            </div>

            <div class="SortButton">
                <button class="button" id="sortButton">SORT</button>
                <button class="button" id="stopButton" disabled>STOP</button>
            </div>

            <div class="meta-grid">
                <div class="meta-item">
                    <span class="meta-label">Algorithm</span>
                    <span class="meta-value" id="algoName">Bubble Sort</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Complexity</span>
                    <span class="meta-value" id="algoComplexity">Time: O(n^2) | Space: O(1)</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Status</span>
                    <span class="meta-value" id="sortStatus">Ready</span>
                </div>
            </div>
        </section>

        <section class="bars-card">
            <div>
                <ul id="ArrayBars">
                </ul>
            </div>

            <div class="Array">
                <span class="meta-label">Numbers</span>
                <div id="ArrayNumbers"></div>
            </div>
        </section>
    </div>

    <!--Javascript -->
    <script src="./SortingAlgorithms.js"></script>
    <script src="./Java.js"></script>
</body>
</html>
